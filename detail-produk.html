<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Produk - PKA UMKM</title>
<link rel="stylesheet" href="style.css">
<style>
.container{max-width:1000px;margin:20px auto;padding:20px;background:white;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
.btn-kembali{display:inline-block;margin-bottom:20px;color:#d97706;text-decoration:none;font-weight:bold}
.product-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.product-image-gallery img{width:100%;border-radius:12px}
.product-title{font-size:28px;margin:0}
.current-price{font-size:24px;color:#ff6b6b;font-weight:bold;margin:10px 0}
@media(max-width:768px){.product-detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>PKA UMKM</h1>
  <div class="keranjang-icon" onclick="bukaKeranjang()">🛒 <span id="jumlah-keranjang">0</span></div>
</header>

<div class="container">
  <a href="home.html" class="btn-kembali">⬅ Kembali ke Katalog</a>
  <div id="detail-wrapper">Memuat detail produk...</div>
</div>

<div id="modal-keranjang" class="modal">
  <div class="modal-content">
    <span class="close" onclick="tutupKeranjang()">&times;</span>
    <h2 id="judul-modal">Keranjang</h2>
    <div id="isi-keranjang"></div>
    <h3 id="total-harga"></h3>
    <button id="btn-aksi"></button>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmu_GRCGWjOCyDPMjZCP1VI41O9aON3etuiLSL9ITBs9hR-wQHeyExANrUlQ_pNzwP/exec";
let keranjang = JSON.parse(localStorage.getItem('keranjangPKA')) || [];
let produkAktif = null;
let produkSementara = null;

// KODE KERANJANG SAMA PERSIS KAYAK DI HOME
function tambahKeKeranjang(id, nama, harga) {
    produkSementara = { id, nama, harga, jumlah: 1 };
    bukaModalProduk();
}
function bukaModalProduk() {
    document.getElementById('judul-modal').innerText = produkSementara.nama;
    document.getElementById('isi-keranjang').innerHTML = `<div class="item-keranjang"><div><b>${produkSementara.nama}</b><br>Rp ${produkSementara.harga.toLocaleString('id-ID')}</div><div><button class="qty-btn" onclick="kurangQtySementara()">-</button><span style="padding: 0 10px; font-weight: bold;">${produkSementara.jumlah}</span><button class="qty-btn" onclick="tambahQtySementara()">+</button></div></div>`;
    document.getElementById('total-harga').style.display = 'none';
    document.getElementById('btn-aksi').style.display = 'block';
    document.getElementById('btn-aksi').innerText = 'Tambah ke Keranjang';
    document.getElementById('btn-aksi').onclick = konfirmasiTambah;
    document.getElementById('modal-keranjang').style.display = 'flex';
}
function tambahQtySementara() { produkSementara.jumlah += 1; bukaModalProduk(); }
function kurangQtySementara() { if (produkSementara.jumlah > 1) { produkSementara.jumlah -= 1; bukaModalProduk(); } }
function konfirmasiTambah() { let item = keranjang.find(p => p.id === produkSementara.id); if (item) { item.jumlah += produkSementara.jumlah; } else { keranjang.push(produkSementara); } simpanKeranjang(); produkSementara = null; tutupKeranjang(); alert('✅ Produk ditambahkan ke keranjang!'); }
function simpanKeranjang(){ localStorage.setItem('keranjangPKA', JSON.stringify(keranjang)); updateKeranjangIcon(); }
function updateKeranjangIcon(){ document.getElementById('jumlah-keranjang').innerText = keranjang.reduce((a,b)=>a+b.jumlah,0); }
function bukaKeranjang() { if (keranjang.length === 0) { alert('Keranjang masih kosong!'); return; } document.getElementById('judul-modal').innerText = 'Keranjang Belanja'; document.getElementById('total-harga').style.display = 'block'; updateKeranjang(); document.getElementById('isi-keranjang').innerHTML += `<h3 style="margin-top:20px; text-align:center;">Pilih Metode Pembayaran</h3><div class="metode-bayar"><button onclick="bayar('DANA')">💙 Bayar DANA</button><button onclick="bayar('GOPAY')">💚 Bayar GoPay</button><button onclick="bayar('MANDIRI')">💛 Bayar Mandiri</button></div>`; document.getElementById('btn-aksi').style.display = 'none'; document.getElementById('modal-keranjang').style.display = 'flex'; }
function updateKeranjang() { let isi = document.getElementById('isi-keranjang'); let total = 0; isi.innerHTML = ''; keranjang.forEach((item, index) => { total += item.harga * item.jumlah; isi.innerHTML += `<div class="item-keranjang"><div><b>${item.nama}</b><br>Rp ${item.harga.toLocaleString('id-ID')} x ${item.jumlah}</div><div><button class="qty-btn" onclick="kurangQty(${index})">-</button><button class="qty-btn" onclick="tambahQty(${index})">+</button><button class="qty-btn hapus" onclick="hapusItem(${index})">Hapus</button></div></div>`; }); document.getElementById('total-harga').innerText = `Total: Rp ${total.toLocaleString('id-ID')}`; }
function tambahQty(i){keranjang[i].jumlah++; simpanKeranjang(); bukaKeranjang();}
function kurangQty(i){keranjang[i].jumlah>1?keranjang[i].jumlah--:keranjang.splice(i,1); simpanKeranjang(); bukaKeranjang();}
function hapusItem(i){keranjang.splice(i,1); simpanKeranjang(); bukaKeranjang();}
function tutupKeranjang(){document.getElementById('modal-keranjang').style.display='none';}
function bayar(metode) { let total = keranjang.reduce((sum, item) => sum + item.harga * item.jumlah, 0); let infoPembayaran = ""; if(metode === 'DANA'){ infoPembayaran = `Transfer ke DANA: 08998628025<br><img src="dana.jpg" style="width:200px; margin:auto; display:block;">`; } if(metode === 'GOPAY'){ infoPembayaran = `Transfer ke GoPay: 08998628025<br><img src="gopay.jpg" style="width:200px; margin:auto; display:block;">`; } if(metode === 'MANDIRI'){ infoPembayaran = `Transfer ke Mandiri: 1270011397252 a/n Sabda Gusti Nang Wardoyo`; } document.getElementById('judul-modal').innerText = `Bayar via ${metode}`; document.getElementById('isi-keranjang').innerHTML = `<div style="text-align:center;"><h2 style="color:#ff6b6b;">Rp ${total.toLocaleString('id-ID')}</h2><p>${infoPembayaran}</p></div>`; localStorage.setItem('pesananSabda', JSON.stringify(keranjang)); document.getElementById('btn-aksi').style.display = 'block'; document.getElementById('btn-aksi').innerText = 'Upload Bukti Pembayaran'; document.getElementById('btn-aksi').onclick = () => { window.location.href = `bukti-pembayaran.html?metode=${metode}&total=${total}`; }; document.getElementById('total-harga').style.display = 'none'; }
window.onclick = function(event) { let modal = document.getElementById('modal-keranjang'); if (event.target == modal) { modal.style.display = 'none'; } }

// LOAD DETAIL
function loadDetail(){
  const id = new URLSearchParams(window.location.search).get('id');
  if(!id) { document.getElementById('detail-wrapper').innerHTML="<h2>ID Produk tidak ada</h2>"; return; }
  const s = document.createElement('script');
  s.src = SCRIPT_URL + "?callback=renderDetail";
  document.body.appendChild(s);
}

function renderDetail(data){
  const id = new URLSearchParams(window.location.search).get('id');
  produkAktif = data.find(p => p.id == id);
  if(!produkAktif){ document.getElementById('detail-wrapper').innerHTML="<h2>Produk tidak ditemukan</h2>"; return; }

  document.title = produkAktif.nama + " - PKA UMKM";
  document.getElementById('detail-wrapper').innerHTML = `
  <div class="product-detail-grid">
    <div class="product-image-gallery"><img src="${produkAktif.foto}" onerror="this.src='https://via.placeholder.com/400'"></div>
    <div class="product-info">
      <h1 class="product-title">${produkAktif.nama}</h1>
      <div class="current-price">Rp ${Number(produkAktif.harga).toLocaleString('id-ID')}</div>
      <p style="line-height:1.7;margin:20px 0">${produkAktif.deskripsi}</p>
      <button class="btn-checkout" onclick="tambahKeKeranjang(${produkAktif.id}, '${produkAktif.nama}', ${produkAktif.harga})">🛒 Tambah Keranjang</button>
    </div>
  </div>`;
  updateKeranjangIcon();
}
loadDetail();
</script>
</body>
</html>
