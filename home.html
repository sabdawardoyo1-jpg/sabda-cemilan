<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PKA UMKM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>PKA UMKM</h1>
    <div class="keranjang-icon" onclick="bukaKeranjang()">🛒 <span id="jumlah-keranjang">0</span></div>
</header>

<section class="banner-salam">
    <h2>Info penting</h2>
    <p>kami hanya mengirim pesanan di hari sabtu minggu</p>
</section>

    <main class="produk-container" id="produk-container">
        Memuat produk...
    </main>

<!-- MODAL KERANJANG -->
<div id="modal-keranjang" class="modal">
    <div class="modal-content">
        <span class="close" onclick="tutupKeranjang()">&times;</span>
        <h2>Keranjang Belanja</h2>
        <div id="isi-keranjang"></div>
        <h3 id="total-harga">Total: Rp 0</h3>
        <button id="btn-aksi" onclick="checkoutWA()">Checkout via WA</button>
    </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmu_GRCGWjOCyDPMjZCP1VI41O9aON3etuiLSL9ITBs9hR-wQHeyExANrUlQ_pNzwP/exec"; 
let daftarProduk = [];
let keranjang = JSON.parse(localStorage.getItem('keranjangPKA')) || [];

// LOAD PRODUK DARI SHEET
function loadProduk(){
  const s = document.createElement('script');
  s.src = SCRIPT_URL + "?callback=renderProduk&t=" + new Date().getTime();
  document.body.appendChild(s);
}

function renderProduk(data){
  daftarProduk = data;
  const wrap = document.getElementById('produk-container');
  if(data.length === 0){ wrap.innerHTML = "Belum ada produk. Tambah di admin.html"; return; }
  
  wrap.innerHTML = data.map(p => `
    <div class="produk-card">
        <img src="${p.foto}" alt="${p.nama}" onclick="location.href='detail-produk.html?id=${p.id}'" style="cursor:pointer;">
        <h3 onclick="location.href='detail-produk.html?id=${p.id}'" style="cursor:pointer;">${p.nama}</h3>
        <p class="harga">Rp ${p.harga.toLocaleString('id-ID')}</p>
        <div class="btn-card-group" style="display:flex; gap:8px;">
            <a href="detail-produk.html?id=${p.id}" style="flex:1; background:#f0f0f0; color:#333; text-decoration:none; padding:10px; border-radius:10px; font-weight:600; font-size:14px; text-align:center;">Detail</a>
            <button onclick="tambahKeKeranjang(${p.id}, '${p.nama}', ${p.harga})" style="flex:1;">Beli</button>
        </div>
    </div>
  `).join('');
  updateKeranjangIcon();
}

// FUNGSI KERANJANG
function tambahKeKeranjang(id, nama, harga){
  let item = keranjang.find(p => p.id === id);
  if(item){ item.jumlah++; } else { keranjang.push({id, nama, harga, jumlah:1}); }
  simpanKeranjang();
  alert(`✅ ${nama} ditambah ke keranjang`);
}
function simpanKeranjang(){ localStorage.setItem('keranjangPKA', JSON.stringify(keranjang)); updateKeranjangIcon(); }
function updateKeranjangIcon(){ document.getElementById('jumlah-keranjang').innerText = keranjang.reduce((a,b)=>a+b.jumlah,0); }
function bukaKeranjang(){
  let html = keranjang.length === 0? "<p>Keranjang kosong</p>" : keranjang.map(p=>`<p>${p.nama} x${p.jumlah} - Rp ${(p.harga*p.jumlah).toLocaleString('id-ID')}</p>`).join('');
  document.getElementById('isi-keranjang').innerHTML = html;
  let total = keranjang.reduce((a,b)=>a+b.harga*b.jumlah,0);
  document.getElementById('total-harga').innerText = "Total: Rp " + total.toLocaleString('id-ID');
  document.getElementById('modal-keranjang').style.display = 'block';
}
function tutupKeranjang(){ document.getElementById('modal-keranjang').style.display = 'none'; }
function checkoutWA(){
  let pesan = "Halo PKA UMKM, saya mau pesan:\n" + keranjang.map(p=>`${p.nama} x${p.jumlah}`).join('\n');
  window.open(`https://wa.me/628998628025?text=${encodeURIComponent(pesan)}`, '_blank');
}

loadProduk();
</script>
</body>
</html>
