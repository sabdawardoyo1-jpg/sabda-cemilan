<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PKA UMKM - Produk Unggulan</title>
<style>
body{font-family:Segoe UI;background:#fff8f0;margin:0;padding:0}
.header{background:#d97706;color:white;text-align:center;padding:20px}
.header h1{margin:0;font-size:24px}
.container{padding:20px;max-width:1200px;margin:auto}
#list-produk{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.produk-card{background:white;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.08);padding:12px;text-align:center}
.produk-card img{width:100%;height:200px;object-fit:cover;border-radius:8px}
.produk-card h3{font-size:16px;margin:10px 0 5px;color:#333}
.harga{color:#d97706;font-weight:bold;font-size:18px;margin:5px 0 10px}
.btn-card-group{display:flex;gap:8px}
.btn-card-group a, .btn-card-group button{flex:1;border:none;padding:10px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;text-align:center}
.btn-card-group a{background:#f0f0f0;color:#333}
.btn-card-group button{background:#d97706;color:white}
.btn-card-group button:hover{background:#b45309}
.loading{text-align:center;padding:40px;font-size:18px;color:#666}
</style>
</head>
<body>

<div class="header">
  <h1>PKA UMKM</h1>
  <p>Produk Unggulan UMKM Nusantara</p>
</div>

<div class="container">
  <h2>Semua Produk</h2>
  <div id="list-produk" class="loading">Memuat produk...</div>
</div>

<script>
// INI DATA DARI GOOGLE SHEET KAMU - SUDAH DIGANTI
const SHEET_ID = "2PACX-1vQtQBjX-ELS_mAyb6lZngy9ygDvW5bmlRYi1y8oa277BpHXojZojupZK4bgbjuEaKwwVaOTcgCSZxp";
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

fetch(SHEET_URL)
.then(res => res.text())
.then(rep => {
    const json = JSON.parse(rep.substr(47).slice(0,-2));
    const produk = json.table.rows;
    let html = "";
    
    if(produk.length === 0){
      html = "<p>Belum ada produk. Silahkan tambah di halaman admin.html</p>";
    } else {
      produk.forEach((p,i) => {
          if(!p.c[0]) return; // skip baris kosong
          const nama = p.c[0].v;
          const harga = p.c[1].v;
          const foto = p.c[2].v;
          const deskripsi = p.c[4] ? p.c[4].v : "";
          const id = i+1; // ID berdasarkan urutan baris
          
          html += `<div class="produk-card">
              <img src="${foto}" alt="${nama}" onclick="location.href='detail-produk.html?id=${id}'" style="cursor:pointer;">
              <h3 onclick="location.href='detail-produk.html?id=${id}'" style="cursor:pointer;">${nama}</h3>
              <p class="harga">Rp ${Number(harga).toLocaleString('id-ID')}</p>
              <div class="btn-card-group">
                  <a href="detail-produk.html?id=${id}">Detail</a>
                  <button onclick="tambahKeKeranjang(${id}, '${nama}', ${harga})">Beli</button>
              </div>
          </div>`;
      });
    }
    document.getElementById('list-produk').innerHTML = html;
})
.catch(err => {
  document.getElementById('list-produk').innerHTML = "<p>❌ Gagal memuat produk. Cek koneksi & pastikan Sheet di 'Publikasikan ke web'</p>";
  console.log(err)
});

// FUNGSI KERANJANG SEDERHANA
let keranjang = JSON.parse(localStorage.getItem('keranjang')) || [];
function tambahKeKeranjang(id, nama, harga){
  keranjang.push({id, nama, harga, qty:1});
  localStorage.setItem('keranjang', JSON.stringify(keranjang));
  alert(nama + " ditambahkan ke keranjang!");
}
</script>

</body>
</html>
