<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><title>Admin PKA UMKM</title>
<style>body{font-family:Segoe UI;background:#fff8f0;padding:20px;max-width:800px;margin:auto}.card{background:white;padding:20px;border-radius:12px} input,textarea{width:95%;padding:12px;margin:8px 0;border:1px solid #ddd} button{background:#d97706;color:white;border:none;padding:14px;width:100%;border-radius:8px;font-weight:bold;cursor:pointer} table{width:100%;margin-top:20px} td,th{border:1px solid #ddd;padding:8px}</style>
</head>
<body>
<div class="card">
  <h2>📦 Admin PKA UMKM</h2>
  <form id="formProduk" method="POST">
    <input name="nama" placeholder="Nama Produk" required>
    <input name="harga" type="number" placeholder="Harga" required>
    <input name="foto" placeholder="Link Foto Google Drive" required>
    <input name="wa" value="628998628025">
    <textarea name="deskripsi" placeholder="Deskripsi"></textarea>
    <button type="submit">Simpan Produk</button>
  </form>
  <p id="status"></p>
</div>

<h3>Data Produk</h3>
<div id="tabel-produk">Memuat...</div>

<iframe name="hidden_iframe" style="display:none" onload="setTimeout(loadData,1000)"></iframe>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmu_GRCGWjOCyDPMjZCP1VI41O9aON3etuiLSL9ITBs9hR-wQHeyExANrUlQ_pNzwP/exec"; // WAJIB GANTI
document.getElementById('formProduk').action = SCRIPT_URL;
document.getElementById('formProduk').target = "hidden_iframe";

document.getElementById('formProduk').onsubmit = function(){
  status.innerText = "Menyimpan...";
}

function loadData(){
  status.innerText = "✅ Berhasil disimpan!";
  formProduk.reset();
  const s = document.createElement('script');
  s.src = SCRIPT_URL + "?callback=renderTabel&t=" + new Date().getTime();
  document.body.appendChild(s);
}

function renderTabel(data){
  let html = "<table><tr><th>Foto</th><th>Nama</th><th>Harga</th><th>Aksi</th></tr>";
  data.forEach(p => {
    html += `<tr>
      <td><img src="${p.foto}" width="40"></td>
      <td>${p.nama}</td>
      <td>Rp ${Number(p.harga).toLocaleString('id-ID')}</td>
      <td><button style="background:red;color:white" onclick="hapus(${p.row})">Hapus</button></td>
    </tr>`;
  });
  html += "</table>";
  document.getElementById('tabel-produk').innerHTML = html;
}

function hapus(row){
  if(confirm("Yakin hapus?")){
    const s = document.createElement('script');
    s.src = SCRIPT_URL + "?hapus=" + row + "&callback=loadData";
    document.body.appendChild(s);
  }
}
loadData();
</script>
</body>
</html>
